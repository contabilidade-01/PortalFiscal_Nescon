{% extends 'base.html' %}
{% block titulo %}Trocar senha{% endblock %}
{% block corpo %}
<div style="max-width:460px;margin:0 auto">
  <div class="card">
    <h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Trocar senha</h2>
    <p class="desc">Escolha uma senha forte (mínimo 6 caracteres).</p>
    <form method="post" action="{{ url_for('trocar_senha') }}">
      <label>Senha atual</label><input name="atual" type="password" required>
      <label>Nova senha</label><input name="nova" type="password" required minlength="6">
      <button class="btn btn-primary" style="margin-top:18px">Salvar nova senha</button>
    </form>
  </div>
</div>
{% endblock %}
